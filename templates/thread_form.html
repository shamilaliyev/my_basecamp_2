{% extends "base.html" %}

{% block content %}
<section class="simple-form-page">
    <a class="back-link" href="{{ url_for('project_show', project_id=project.id) }}">← back to project</a>

    <div class="form-paper">
        {% if thread %}
            <p class="kicker dark">edit discussion</p>
            <h1>Edit Thread</h1>
        {% else %}
            <p class="kicker dark">new discussion</p>
            <h1>Create Thread</h1>
        {% endif %}

        <p class="form-subtitle">{{ project.title }}</p>

        {% if thread %}
            <form method="post" action="{{ url_for('thread_update', thread_id=thread.id) }}">
        {% else %}
            <form method="post" action="{{ url_for('thread_create', project_id=project.id) }}">
        {% endif %}
            <label>Title</label>
            <input name="title" value="{{ thread.title if thread else '' }}" required>

            <label>Description</label>
            <textarea name="description" rows="7" required>{{ thread.description if thread else '' }}</textarea>

            <button class="full-button">
                {% if thread %}Save Changes{% else %}Create Thread{% endif %}
            </button>
        </form>
    </div>
</section>
{% endblock %}
